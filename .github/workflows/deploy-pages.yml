name: Pubblica VIVAELFUTBOL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Ricostruisci il progetto
        run: |
          cat tiny/part-*.b64 > viva.b64
          base64 -d viva.b64 > viva.zip
          mkdir app
          unzip -q viva.zip -d app

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa dipendenze
        working-directory: app
        run: npm install

      - name: Compila l'app
        working-directory: app
        run: npm run build

      - name: Configura e attiva GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepara i file da pubblicare
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
